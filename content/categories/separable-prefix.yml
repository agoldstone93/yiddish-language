name: Separable Prefix Verbs
slug: separable-prefix
example_slug: oyfhern
example_label: (e.g. {{yi:אויפֿהערן}})
content: >-
  This category applies to Yiddish verbs that have a separable prefix. In these
  verbs, the prefix can be separated from the main verb in certain tenses and
  constructions.


  ## Present Tense


  In the present tense, verbs are conjugated by adding specific endings to the verb stem based on the subject pronoun like in simple verbs. However, for separable-prefix verbs, to get the verb stem, its prefix is separated and is added as a separate word after the main verb. Then the ending (normally {{yi:ן}}) is removed from the main verb.


  Here's an example using the verb {{yi:אויפֿהערן}} (to start):


  | Pronoun  | Meaning        | Ending | Example                |

  | -------- | -------------- | ------ | ---------------------- |

  | {{yi:איך}}      | I              | ־      | {{yi:אויפֿהערן}} ←  {{yi:הער אויף}}  |

  | {{yi:דו}}       | you (singular) | סט     | {{yi:אויפֿהערן}} ← {{yi:הערסט אויף}} |

  | {{yi:ער/זי/עס}} | he/she/it      | ט      | {{yi:אויפֿהערן}} ← {{yi:הערט אויף}}  |

  | {{yi:מיר}}      | we             | ן      | {{yi:אויפֿהערן}} ← {{yi:הערן אויף}}  |

  | {{yi:איר}}      | you (plural)   | ט      | {{yi:אויפֿהערן}} ← {{yi:הערט אויף}}  |

  | {{yi:זיי}}      | they           | ן      | {{yi:אויפֿהערן}} ← {{yi:הערן אויף}}  |


  ## Past Tense


  The past tense for periphrastic, reflexive, separable-prefix and simple verbs is formed in a similar manner and follows the same rules. It is formed using the auxiliary verb {{yi:האָבן}} (to have) or {{yi:זיין}} (to be) followed by the past participle of the main verb.


  In most cases, {{yi:האָבן}} is used, but {{yi:זיין}} is used with verbs that indicate motion or change of state.


  For separable-prefix verbs, the past participle is often formed by adding {{yi:גע}} within the infinitive, between the prefix and the main verb, and replacing the {{yi:־ן}} ending with a {{yi:־ט}}, though there are many exceptions; in general the past participle needs to memorised.


  {{yi:אויפֿהערן}} ←  {{yi:אויפֿגעהערט}}


  Using the same example with {{yi:אויפֿהערן}}:


  | Pronoun  | Formation               | Example               |

  | -------- | ----------------------- | --------------------- |

  | {{yi:איך}}      | {{yi:האָב}} + past participle  | {{yi:איך האָב אויפֿגעהערט}}  |

  | {{yi:דו}}       | {{yi:האָסט}} + past participle | {{yi:דו האָסט אויפֿגעהערט}}  |

  | {{yi:ער/זי/עס}} | {{yi:האָט}} + past participle  | {{yi:ער האָט אויפֿגעהערט}}   |

  | {{yi:מיר}}      | {{yi:האָבן}} + past participle | {{yi:מיר האָבן אויפֿגעהערט}} |

  | {{yi:איר}}      | {{yi:האָט}} + past participle  | {{yi:איר האָט אויפֿגעהערט}}  |

  | {{yi:זיי}}      | {{yi:האָבן}} + past participle | {{yi:זיי האָבן אויפֿגעהערט}} |


  ## Future Tense


  The future tense for periphrastic, reflexive, separable-prefix and simple verbs is formed in a similar manner and follows the same rules. It is formed using the auxiliary verb {{yi:וועלן}} (will) followed by the infinitive form of the main verb.


  Here is an example for {{yi:אויפֿהערן}}:


  | Pronoun  | Formation         | Example             |

  | -------- | ----------------- | ------------------- |

  | {{yi:איך}}      | {{yi:װעל}} + infinitive  | {{yi:איך וועל אויפֿהערן}}  |

  | {{yi:דו}}       | {{yi:װעסט}} + infinitive | {{yi:דו וועסט אויפֿהערן}}  |

  | {{yi:ער/זי/עס}} | {{yi:װעט}} + infinitive  | {{yi:ער וועט אויפֿהערן}}   |

  | {{yi:מיר}}      | {{yi:װעלן}} + infinitive | {{yi:מיר וועלן אויפֿהערן}} |

  | {{yi:איר}}      | {{yi:װעט}} + infinitive  | {{yi:איר וועט אויפֿהערן}}  |

  | {{yi:זיי}}      | {{yi:װעלן}} + infinitive | {{yi:זיי וועלן אויפֿהערן}} |
